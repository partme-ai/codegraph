name: Zig validation
on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '__tests__/zig*'
      - '__tests__/fixtures/zig*'
      - 'scripts/**'
      - 'docs/grammars/**'
      - 'package*.json'
      - '.github/workflows/zig-validation.yml'
  pull_request:
    paths:
      - 'src/**'
      - '__tests__/zig*'
      - '__tests__/fixtures/zig*'
      - 'scripts/**'
      - 'docs/grammars/**'
      - 'package*.json'
      - '.github/workflows/zig-validation.yml'
permissions:
  contents: read
jobs:
  runtime:
    name: Zig runtime (${{ matrix.runner }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # Native execution on every published OS/architecture, not cross-packaging.
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2022, windows-11-arm]
        node: [22, 24]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Runtime graph contract (no skipped tests)
        run: |
          npx vitest run __tests__/zig-extraction.test.ts __tests__/zig-production.test.ts __tests__/zig-static-semantics.test.ts __tests__/zig-instance-fields.test.ts __tests__/zig-acceptance.test.ts --maxWorkers=2 --minWorkers=1 --reporter=default --reporter=json --outputFile=zig-tests.json
          node scripts/check-zig-test-report.mjs zig-tests.json
      - name: Packed production artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zig-package"
          npm pack --pack-destination "$RUNNER_TEMP/zig-package"
          version=$(node -p "require('./package.json').version")
          tar -xzf "$RUNNER_TEMP/zig-package/colbymchenry-codegraph-$version.tgz" -C "$RUNNER_TEMP/zig-package"
          # Pin dependency resolution to the reviewed lockfile; the tarball itself
          # supplies every runtime file and the grammar notice.
          cp package-lock.json "$RUNNER_TEMP/zig-package/package/package-lock.json"
          npm ci --omit=dev --ignore-scripts --prefix "$RUNNER_TEMP/zig-package/package"
          node --liftoff-only scripts/check-zig-package.mjs "$RUNNER_TEMP/zig-package/package"
          CODEGRAPH_PARALLEL_RESOLVE_MIN=0 node --liftoff-only scripts/check-zig-package.mjs "$RUNNER_TEMP/zig-package/package"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zig-tests-${{ matrix.runner }}-node-${{ matrix.node }}
          path: zig-tests.json
          if-no-files-found: error
  compiler:
    name: Zig compiler and full regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare pinned fixture compiler
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
      - run: npm ci
      - run: npm run build
      - name: Compiler-backed graph contracts and both syntax modes
        env:
          ZIG_COMPILER: ${{ runner.temp }}/zig-x86_64-linux-0.16.0/zig
        run: |
          npx vitest run __tests__/zig-extraction.test.ts __tests__/zig-production.test.ts __tests__/zig-static-semantics.test.ts __tests__/zig-instance-fields.test.ts __tests__/zig-acceptance.test.ts --maxWorkers=2 --minWorkers=1 --reporter=default --reporter=json --outputFile=zig-tests.json
          node scripts/check-zig-test-report.mjs zig-tests.json
          node scripts/check-zig-ast.mjs
          node scripts/check-zig-ast.mjs --recovery-contract
      - name: Cross-language regression
        run: npx vitest run --maxWorkers=2 --minWorkers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zig-compiler-tests
          path: zig-tests.json
          if-no-files-found: error
