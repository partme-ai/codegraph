name: Zig fork validation

on:
  push:
    branches: [fix/zig-upstream-review-20261031, release/v1.6.2-zig]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'partme-ai/codegraph'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Grammar provenance and packaged license
        run: |
          test -f vendor/tree-sitter-zig/LICENSE
          test -f docs/grammars/LICENSE.tree-sitter-zig
          test -f dist/extraction/wasm/LICENSE.tree-sitter-zig
          echo '1c3aa3fc4f0f4bb0e22ed61e835afb0295348486f7144fb42422cf22bf9f850b  src/extraction/wasm/tree-sitter-zig.wasm' | sha256sum -c -
      - name: Rebuild Zig grammar from vendored source
        run: |
          cargo install tree-sitter-cli --version 0.27.0 --locked
          bash scripts/build-zig-grammar.sh "$RUNNER_TEMP/tree-sitter-zig.wasm"
          cmp "$RUNNER_TEMP/tree-sitter-zig.wasm" src/extraction/wasm/tree-sitter-zig.wasm
      - name: Zig graph and worker contracts
        run: |
          npx vitest run __tests__/zig-extraction.test.ts __tests__/zig-production.test.ts __tests__/zig-static-semantics.test.ts __tests__/zig-instance-fields.test.ts __tests__/zig-acceptance.test.ts --maxWorkers=2 --reporter=default --reporter=json --outputFile=zig-tests.json
          node scripts/check-zig-test-report.mjs zig-tests.json
          npx vitest run __tests__/worker-teardown.test.ts --maxWorkers=2
      - name: MCP daemon contracts
        run: npx vitest run __tests__/mcp-daemon.test.ts --maxWorkers=2
      - name: Compiler-backed Zig syntax parity
        run: |
          curl --fail --silent --show-error --location https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          ZIG_COMPILER="$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" node scripts/check-zig-ast.mjs
          ZIG_COMPILER="$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" node scripts/check-zig-ast.mjs --recovery-contract
      - name: Installable package smoke
        run: |
          node scripts/check-zig-package.mjs .
          CODEGRAPH_PARALLEL_RESOLVE_MIN=0 node scripts/check-zig-package.mjs .
          npm pack --dry-run
      - name: Cross-language regression
        run: npx vitest run --maxWorkers=2
