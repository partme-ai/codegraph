name: PartMe release build
on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: Reuse verified artifacts and publish without rebuilding
        type: boolean
        default: false
      artifact_run:
        description: Successful PartMe release build run
        type: string
        default: '36454692736'
  push:
    tags: ['v*-zig*']
concurrency:
  group: partme-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bundle:
    if: github.repository == 'partme-ai/codegraph' && inputs.publish_only != true
    name: Bundle (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: linux-x64, triple: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: linux-arm64, triple: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, target: darwin-x64, triple: x86_64-apple-darwin }
          - { runner: macos-15, target: darwin-arm64, triple: aarch64-apple-darwin }
          - { runner: windows-2022, target: win32-x64, triple: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: win32-arm64, triple: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Stage fork distribution
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != v1.6.0-zig ]]; then
            echo 'Update the declared release version before tagging a new distribution.' >&2
            exit 1
          fi
          CODEGRAPH_RELEASE_STAGE=1 node scripts/prepare-partme-release.mjs .
      - run: npm ci
      - name: Build native extraction kernel
        run: bash scripts/build-kernel.sh --target '${{ matrix.triple }}'
      - name: Build native platform bundle
        run: bash scripts/build-bundle.sh '${{ matrix.target }}'
      - name: Native kernel parity
        if: matrix.target == 'linux-x64'
        run: CODEGRAPH_KERNEL_EXPECT=1 npx vitest run __tests__/kernel-*.test.ts --maxWorkers=2 --minWorkers=1
      - name: Verify installed fork identity and Zig graph behavior
        run: |
          set -euo pipefail
          bash scripts/pack-npm.sh 1.6.0-zig
          target='${{ matrix.target }}'
          package_dir="release/npm/codegraph-$target"
          test -f "$package_dir/lib/kernel/codegraph-kernel.node"
          test -f "$package_dir/LICENSE"
          test -f release/npm/main/LICENSE
          runtime="$package_dir/node"
          if [[ "$RUNNER_OS" == Windows ]]; then runtime="$package_dir/node.exe"; fi
          test "$("$runtime" --liftoff-only "$package_dir/lib/dist/bin/codegraph.js" --version)" = '1.6.0-zig'
          "$runtime" --liftoff-only scripts/check-zig-package.mjs "$package_dir/lib"
          CODEGRAPH_PARALLEL_RESOLVE_MIN=0 "$runtime" --liftoff-only scripts/check-zig-package.mjs "$package_dir/lib"
          mkdir -p release/npm/main/node_modules/@partme.ai
          cp -R "$package_dir" "release/npm/main/node_modules/@partme.ai/codegraph-$target"
          CODEGRAPH_NO_DOWNLOAD=1 node release/npm/main/npm-shim.js --version
          node --liftoff-only -e "const assert=require('node:assert/strict');const sdk=require('./release/npm/main/npm-sdk.js');assert.equal(typeof sdk.CodeGraph,'function');const u=require('./$package_dir/lib/dist/upgrade');assert.equal(u.REPO,'partme-ai/codegraph');assert.equal(u.NPM_PACKAGE,'@partme.ai/codegraph');"
          npx vitest run __tests__/npm-shim.test.ts __tests__/npm-sdk.test.ts __tests__/upgrade.test.ts --maxWorkers=2 --minWorkers=1
      - uses: actions/upload-artifact@v4
        with:
          name: partme-${{ matrix.target }}
          path: |
            release/codegraph-*.tar.gz
            release/codegraph-*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.repository == 'partme-ai/codegraph' && github.event_name == 'workflow_dispatch' && inputs.publish_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_RUN: ${{ inputs.artifact_run }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify artifact source
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN" --jq '{name,head_sha,status,conclusion}'
          node -e "const cp=require('node:child_process'),a=require('node:assert/strict'),r=JSON.parse(cp.execFileSync('gh',['api','repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.ARTIFACT_RUN],{encoding:'utf8'}));a.equal(r.conclusion,'success');a.equal(r.head_sha,'1408a883265172a90a52fabd1ba2adfe6287a3eb');a.equal(r.name,'PartMe release build');"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run }}
          pattern: partme-*
          merge-multiple: true
          path: release
      - name: Assemble verified packages without compilation
        run: |
          # Recovery of this immutable version must use its original packaging
          # transform. Later README fixes apply to the next distribution only.
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/prepare-partme-release.mjs?ref=1408a883265172a90a52fabd1ba2adfe6287a3eb" --jq .content | base64 --decode > "$RUNNER_TEMP/prepare-partme-release.mjs"
          CODEGRAPH_RELEASE_STAGE=1 node "$RUNNER_TEMP/prepare-partme-release.mjs" .
          tar -xzf release/codegraph-linux-x64.tar.gz -C "$RUNNER_TEMP"
          cp -R "$RUNNER_TEMP/codegraph-linux-x64/lib/dist" dist
          bash scripts/pack-npm.sh 1.6.0-zig
      - name: Publish npm packages and GitHub prerelease
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-partme-release.mjs
      - name: Verify unversioned npx installation from registry
        env:
          CODEGRAPH_NO_DOWNLOAD: '1'
        run: |
          cd "$RUNNER_TEMP"
          actual=$(npm exec --yes --cache "$RUNNER_TEMP/npm-smoke-cache" --package=@partme.ai/codegraph -- codegraph --version)
          test "$actual" = '1.6.0-zig'
          echo "Verified npx @partme.ai/codegraph -> $actual"
