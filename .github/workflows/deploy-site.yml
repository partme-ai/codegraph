name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          path: site
          node-version: 24

  check-pages:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
      - name: Test Pages deployment decision
        run: bash scripts/test-pages-deploy.sh
      - name: Check repository Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-pages-deploy.sh

  deploy:
    needs: [build, check-pages]
    if: ${{ needs['check-pages'].outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
